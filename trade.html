<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贸易数据 · 全球航运数据门户</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">全球航运数据门户
      <span class="sub">港口 · 航线 · 中国进出口贸易</span>
    </a>
    <a class="page" href="index.html">首页</a>
    <a class="page" href="ports.html">港口地图</a>
    <a class="page" href="routes.html">航线运价</a>
    <a class="page" href="trade.html">贸易数据</a>
    <a class="page" href="sources.html">数据源</a>
  </header>

  <main>
    <h1 class="page-title">中国进出口贸易数据</h1>
    <p class="page-desc">月度进出口总值与主要贸易伙伴占比。数据源：海关总署统计快讯（人工维护，每月更新）。</p>
    <div id="data-time" class="data-time"></div>

    <h3 style="margin-bottom:10px;">月度进出口（人民币亿元）</h3>
    <div class="card">
      <div id="trade-chart" class="chart"></div>
    </div>

    <div class="grid cols-2" style="margin-top:20px;">
      <div class="card">
        <h3>月度明细</h3>
        <table class="data">
          <thead><tr><th>月份</th><th>出口</th><th>进口</th><th>合计</th></tr></thead>
          <tbody id="trade-table"></tbody>
        </table>
      </div>
      <div class="card">
        <h3>主要贸易伙伴占比</h3>
        <table class="data">
          <thead><tr><th>贸易伙伴</th><th>占比</th></tr></thead>
          <tbody id="partner-table"></tbody>
        </table>
        <p class="meta" style="margin-top:8px;">来源：<a class="ext" id="trade-source" href="#" target="_blank">海关总署统计数据</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/trade.js"></script>
</body>
</html>
